<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>House Recipe | Register</title>
        <link rel="icon" type="image/svg+xml" href="/images/house-recipe-icon.svg" />
        <link rel="stylesheet" href="/css/style.scss" />
        <script type="module" src="/js/register.js"></script>
    </head>

    <body>
        <header class="site-header" id="main-header"></header>

        <main class="site-main">
            <section class="auth-container">
                <h1>Create Your Account</h1>
                <p class="auth-subtitle">
                    Join House Recipe to save your favorites and preferences.
                </p>

                <form id="register-form" class="auth-form">
                    <label for="name">Name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        minlength="2"
                        maxlength="50"
                    />

                    <label for="username">Username *</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        minlength="3"
                        maxlength="20"
                        pattern="[a-zA-Z0-9_]+"
                        title="Only letters, numbers, and underscores. 3-20 characters."
                    />
                    <small class="input-hint"
                        >Only letters, numbers, and underscores. 3-20 characters.</small
                    >

                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required />

                    <label for="password">Password *</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
                        title="Must contain at least one uppercase letter, one lowercase letter, and one number, and be at least 8 characters long."
                    />
                    <small class="input-hint"
                        >At least 8 characters, with 1 uppercase, 1 lowercase, and 1 number.</small
                    >

                    <label for="confirm-password">Confirm Password *</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        required
                        minlength="8"
                    />

                    <fieldset class="avatar-fieldset">
                        <legend>Choose Your Avatar</legend>
                        <p class="input-hint">Pick an avatar that represents you!</p>
                        <div id="avatar-picker" class="avatar-picker"></div>
                    </fieldset>

                    <button type="submit" class="auth-submit">Create Account</button>
                </form>

                <p id="register-message" class="auth-message hide"></p>

                <p class="auth-footer">Already have an account? <a href="/login/">Login here</a></p>
            </section>
        </main>

        <footer class="site-footer" id="main-footer"></footer>
    </body>
</html>
